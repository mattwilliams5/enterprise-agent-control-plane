steps:
- name: python:3.12-slim
  entrypoint: bash
  args: [-ceu, 'python infrastructure/gcp/control/prepare_context.py']
- name: gcr.io/cloud-builders/docker
  args: [build, '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/storeguard-executive/storeguard-control:$SHORT_SHA', '.local/storeguard-control-build']
images:
- 'us-central1-docker.pkg.dev/$PROJECT_ID/storeguard-executive/storeguard-control:$SHORT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
